<!DOCTYPE html>
<!-- O 'data-bs-theme="auto"' ativará o modo escuro com base no sistema -->
<html lang="pt-BR" data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B3 | Email Analytics</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="gradient-bg">
        <div class="gradient-blur top-right"></div>
        <div class="gradient-blur bottom-left"></div>
    </div>

    <header class="navbar navbar-expand-lg navbar-glass sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <span class="fs-4 fw-bold header-title">B3 <span class="fw-light">| Email Analytics</span></span>
            </a>
             <div class="dropdown">
                <button class="btn btn-outline-primary dropdown-toggle" type="button" id="theme-switcher" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-circle-half"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="theme-switcher">
                    <li><button class="dropdown-item d-flex align-items-center" type="button" data-bs-theme-value="light"><i class="bi bi-sun-fill me-2"></i> Claro</button></li>
                    <li><button class="dropdown-item d-flex align-items-center" type="button" data-bs-theme-value="dark"><i class="bi bi-moon-stars-fill me-2"></i> Escuro</button></li>
                    <li><button class="dropdown-item d-flex align-items-center" type="button" data-bs-theme-value="auto"><i class="bi bi-circle-half me-2"></i> Sistema</button></li>
                </ul>
            </div>
        </div>
    </header>

    <main class="container my-4 my-lg-5">
        <div class="row g-4 g-lg-5">
            <div class="col-lg-5">
                <div class="card p-4">
                    <form id="analysis-form">
                        <ul class="nav nav-tabs nav-fill mb-3" id="myTab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="text-tab" data-bs-toggle="tab" data-bs-target="#text-pane" type="button" role="tab" aria-controls="text-pane" aria-selected="true">
                                    <i class="bi bi-keyboard-fill me-2"></i>Colar Texto
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="file-tab" data-bs-toggle="tab" data-bs-target="#file-pane" type="button" role="tab" aria-controls="file-pane" aria-selected="false">
                                    <i class="bi bi-paperclip me-2"></i>Upload de Arquivo
                                </button>
                            </li>
                        </ul>
                        <div class="tab-content" id="myTabContent">
                            <div class="tab-pane fade show active" id="text-pane" role="tabpanel" aria-labelledby="text-tab" tabindex="0">
                                <div class="mb-3">
                                    <label for="email-text" class="form-label">Cole o conteúdo do e-mail:</label>
                                    <textarea class="form-control" id="email-text" rows="10" placeholder="Cole o e-mail aqui..."></textarea>
                                </div>
                            </div>
            
                            <div class="tab-pane fade" id="file-pane" role="tabpanel" aria-labelledby="file-tab" tabindex="0">
                                <label for="email-file" class="form-label">Arraste ou selecione o arquivo (.txt ou .pdf):</label>
                
                                <label for="email-file" id="drop-zone" class="drop-zone-label">
                                    <div class="text-center">
                                        <i class="bi bi-cloud-arrow-up-fill fs-1 text-primary"></i>
                                        <p class="mb-0 mt-2">Arraste e solte o arquivo aqui</p>
                                        <p class="text-muted small mb-0">ou clique para selecionar</p>
                                    </div>
                                </label>
                                <input class="form-control" type="file" id="email-file" accept=".txt, .pdf" style="display: none;">
                                <div id="file-name-display" class="file-name mt-2 text-muted small"></div>
                            </div>
                        </div>

                        <div class="d-grid mt-3">
                            <button type="submit" class="btn btn-outline-primary btn-lg" id="analyze-button">
                                <span id="button-text">Analisar</span>
                                <span id="button-spinner" class="spinner-border spinner-border-sm" role="status" aria-hidden="true" style="display: none;"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-lg-7">
                
                <div id="results-placeholder" class="card card-body justify-content-center align-items-center h-100 text-center" style="min-height: 300px;">
                    <i class="bi bi-inbox-fill fs-1 text-primary"></i>
                    <h5 class="mt-3 mb-1">Aguardando análise</h5>
                    <p class="text-muted">Os resultados aparecerão aqui.</p>
                </div>

                <div id="results-display" class="card" style="display: none;">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Resultado da Análise</h5>
                        <span id="classification-badge" class="badge rounded-pill fs-6"></span>
                    </div>
                    <div class="card-body">
                        <h6 class="text-muted">Resposta Sugerida</h6>
                        <div class="position-relative">
                            <button id="copy-button" class="btn btn-sm btn-secondary position-absolute top-0 end-0 m-2" data-bs-toggle="tooltip" data-bs-placement="top" title="Copiar">
                                <i class="bi bi-clipboard"></i>
                            </button>
                            <pre id="suggested-reply" class="suggested-reply"></pre>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script>
</body>
</html>
